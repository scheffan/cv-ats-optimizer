name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unitarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reporte-playwright
          path: playwright-report/

  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/tex-ejemplo.js
      - name: Compilar la plantilla con pdflatex
        uses: xu-cheng/latex-action@v3
        with:
          root_file: ejemplo.tex
      - uses: actions/upload-artifact@v4
        with:
          name: cv-ejemplo-pdf
          path: ejemplo.pdf
